spring.datasource.url=jdbc:h2:mem:coworkhub;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.hbm2ddl.import_files=import.sql
management.endpoints.web.exposure.include=health
springdoc.swagger-ui.path=/doc/swagger-ui.html
coworkhub.jwt.secret=coworkhub-test-signing-key-that-is-long-enough
coworkhub.jwt.expiration-seconds=3600
