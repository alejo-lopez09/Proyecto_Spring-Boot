spring.application.name=coworkhub
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/coworkhub?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:coworkhub}
spring.datasource.password=${DB_PASSWORD:coworkhub}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:create}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.hbm2ddl.import_files=import.sql
spring.jpa.defer-datasource-initialization=false
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
springdoc.swagger-ui.path=/doc/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
coworkhub.jwt.secret=${JWT_SECRET:coworkhub-development-signing-key-change-me}
coworkhub.jwt.expiration-seconds=3600
